name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: Explicit deep validation depth to run
        required: true
        default: deep-full
        type: choice
        options:
          - deep-full
  schedule:
    - cron: "0 18 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}

jobs:
  pr-smoke:
    name: PR smoke Python ${{ matrix.python-version }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        shell: bash
        run: |
          set -euo pipefail
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune --depth=1 origin "+${GITHUB_REF}:refs/remotes/ci/ref"
          git checkout --force refs/remotes/ci/ref

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package for smoke tests
        run: python -m pip install -e .

      - name: Validate frontend workbench
        run: PYTHONPATH=src python scripts/validate_frontend_workbench.py

      - name: Compile source and tests
        run: PYTHONPATH=src python -m compileall -q src tests

      - name: Run fast unit contract tests
        run: make test-fast PYTHON=python

      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .

      - name: Install wheel and smoke test console script
        run: |
          python -m venv /tmp/archive-scan-qc-smoke
          /tmp/archive-scan-qc-smoke/bin/python -m pip install --upgrade pip
          /tmp/archive-scan-qc-smoke/bin/python -m pip install dist/ai4archive-*.whl
          /tmp/archive-scan-qc-smoke/bin/archive-scan-qc --version

  pr-targeted-tests:
    name: PR targeted tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        shell: bash
        run: |
          set -euo pipefail
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune --depth=1 origin "+${GITHUB_REF}:refs/remotes/ci/ref"
          git checkout --force refs/remotes/ci/ref
          git fetch --no-tags --prune --depth=1 origin "+${{ github.event.pull_request.base.sha }}:refs/remotes/ci/base"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package for targeted tests
        run: python -m pip install -e .

      - name: Select targeted tests
        id: targeted
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only refs/remotes/ci/base..HEAD > /tmp/changed-files.txt
          python scripts/ci_targeted_selector.py \
            --base-ref refs/remotes/ci/base..HEAD \
            --changed-files-file /tmp/changed-files.txt \
            > /tmp/targeted-tests.txt
          if [ -s /tmp/targeted-tests.txt ]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            tests="$(tr '\n' ' ' < /tmp/targeted-tests.txt | sed 's/[[:space:]]*$//')"
            echo "tests=${tests}" >> "$GITHUB_OUTPUT"
          else
            echo "run_tests=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Changed files:"
          cat /tmp/changed-files.txt
          echo "Selected tests:"
          cat /tmp/targeted-tests.txt

      - name: Run targeted tests
        if: steps.targeted.outputs.run_tests == 'true'
        run: |
          PYTHONPATH=src:tests python -m unittest ${{ steps.targeted.outputs.tests }}

      - name: Skip targeted tests
        if: steps.targeted.outputs.run_tests != 'true'
        run: echo "No Python source or test changes require targeted unittest coverage."

  main-compat-smoke:
    name: Main compatibility smoke Python ${{ matrix.python-version }}
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        shell: bash
        run: |
          set -euo pipefail
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune --depth=1 origin "+${GITHUB_REF}:refs/remotes/ci/ref"
          git checkout --force refs/remotes/ci/ref

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package for smoke tests
        run: python -m pip install -e .

      - name: Validate frontend workbench
        run: PYTHONPATH=src python scripts/validate_frontend_workbench.py

      - name: Compile source and tests
        run: PYTHONPATH=src python -m compileall -q src tests

      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .

      - name: Install wheel and smoke test console script
        run: |
          python -m venv /tmp/archive-scan-qc-smoke
          /tmp/archive-scan-qc-smoke/bin/python -m pip install --upgrade pip
          /tmp/archive-scan-qc-smoke/bin/python -m pip install dist/ai4archive-*.whl
          /tmp/archive-scan-qc-smoke/bin/archive-scan-qc --version

  main-regression-groups:
    name: Main regression ${{ matrix.group }} Python 3.11
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        group:
          - core-image-processing
          - production-cli
          - privacy-boundary
          - external-validation

    steps:
      - name: Check out repository
        shell: bash
        run: |
          set -euo pipefail
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune --depth=1 origin "+${GITHUB_REF}:refs/remotes/ci/ref"
          git checkout --force refs/remotes/ci/ref

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package for regression group
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.group }}" = "external-validation" ]; then
            python -m pip install -e ".[numpy]"
          else
            python -m pip install -e .
          fi

      - name: Run regression group
        run: PYTHONPATH=src:tests python scripts/ci_regression_groups.py run ${{ matrix.group }}

  deep-regression-groups:
    name: Deep regression ${{ matrix.group }} Python ${{ matrix.python-version }}
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'deep-full')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        group:
          - core-image-processing
          - production-cli
          - privacy-boundary
          - external-validation

    steps:
      - name: Check out repository
        shell: bash
        run: |
          set -euo pipefail
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune --depth=1 origin "+${GITHUB_REF}:refs/remotes/ci/ref"
          git checkout --force refs/remotes/ci/ref

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package for regression group
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.group }}" = "external-validation" ]; then
            python -m pip install -e ".[numpy]"
          else
            python -m pip install -e .
          fi

      - name: Validate frontend workbench
        if: matrix.group == 'production-cli'
        run: PYTHONPATH=src python scripts/validate_frontend_workbench.py

      - name: Run regression group
        run: PYTHONPATH=src:tests python scripts/ci_regression_groups.py run ${{ matrix.group }}

      - name: Compile source and tests
        if: matrix.group == 'production-cli'
        run: PYTHONPATH=src python -m compileall -q src tests

      - name: Build wheel
        if: matrix.group == 'production-cli'
        run: python -m pip wheel --no-deps --wheel-dir dist .

      - name: Install wheel and smoke test console script
        if: matrix.group == 'production-cli'
        run: |
          python -m venv /tmp/archive-scan-qc-smoke
          /tmp/archive-scan-qc-smoke/bin/python -m pip install --upgrade pip
          /tmp/archive-scan-qc-smoke/bin/python -m pip install dist/ai4archive-*.whl
          /tmp/archive-scan-qc-smoke/bin/archive-scan-qc --version
