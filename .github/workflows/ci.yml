name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-build-smoke:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package for tests
        run: python -m pip install -e .

      - name: Run unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests

      - name: Compile source and tests
        run: PYTHONPATH=src python -m compileall -q src tests

      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .

      - name: Install wheel and smoke test console script
        run: |
          python -m venv /tmp/archive-scan-qc-smoke
          /tmp/archive-scan-qc-smoke/bin/python -m pip install --upgrade pip
          /tmp/archive-scan-qc-smoke/bin/python -m pip install dist/ai4archive-*.whl
          /tmp/archive-scan-qc-smoke/bin/archive-scan-qc --version
