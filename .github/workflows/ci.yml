name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: Validation depth to run
        required: true
        default: standard
        type: choice
        options:
          - standard
          - deep-full
  schedule:
    - cron: "0 18 * * *"

jobs:
  pr-smoke:
    name: PR smoke Python ${{ matrix.python-version }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        shell: bash
        run: |
          set -euo pipefail
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune --depth=1 origin "+${GITHUB_REF}:refs/remotes/ci/ref"
          git checkout --force refs/remotes/ci/ref

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package for smoke tests
        run: python -m pip install -e .

      - name: Validate frontend workbench
        run: PYTHONPATH=src python scripts/validate_frontend_workbench.py

      - name: Compile source and tests
        run: PYTHONPATH=src python -m compileall -q src tests

      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .

      - name: Install wheel and smoke test console script
        run: |
          python -m venv /tmp/archive-scan-qc-smoke
          /tmp/archive-scan-qc-smoke/bin/python -m pip install --upgrade pip
          /tmp/archive-scan-qc-smoke/bin/python -m pip install dist/ai4archive-*.whl
          /tmp/archive-scan-qc-smoke/bin/archive-scan-qc --version

  pr-targeted-tests:
    name: PR targeted tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        shell: bash
        run: |
          set -euo pipefail
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune --depth=1 origin "+${GITHUB_REF}:refs/remotes/ci/ref"
          git checkout --force refs/remotes/ci/ref
          git fetch --no-tags --prune --depth=1 origin "+${{ github.event.pull_request.base.sha }}:refs/remotes/ci/base"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package for targeted tests
        run: python -m pip install -e .

      - name: Select targeted tests
        id: targeted
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only refs/remotes/ci/base..HEAD > /tmp/changed-files.txt
          python - <<'PY' > /tmp/targeted-tests.txt
          import ast
          import subprocess
          from pathlib import Path

          changed = [
              line.strip()
              for line in Path("/tmp/changed-files.txt").read_text().splitlines()
              if line.strip()
          ]

          def added_test_ids(path: str) -> set[str]:
              diff = subprocess.run(
                  ["git", "diff", "--unified=0", "refs/remotes/ci/base..HEAD", "--", path],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout
              added_names = {
                  line.split("def ", 1)[1].split("(", 1)[0].strip()
                  for line in diff.splitlines()
                  if line.startswith("+") and "def test_" in line
              }
              if not added_names:
                  return set()

              module = path[:-3].replace("/", ".")
              tree = ast.parse(Path(path).read_text(encoding="utf-8"))
              selected = set()
              for node in ast.walk(tree):
                  if not isinstance(node, ast.ClassDef):
                      continue
                  methods = {
                      child.name
                      for child in node.body
                      if isinstance(child, (ast.FunctionDef, ast.AsyncFunctionDef))
                  }
                  for name in added_names & methods:
                      selected.add(f"{module}.{node.name}.{name}")
              return selected

          tests = set()
          for path in changed:
              if path.startswith("tests/test_") and path.endswith(".py"):
                  tests.update(added_test_ids(path) or {path})
              if path.startswith("src/archive_scan_qc/"):
                  tests.add("tests/test_scan_qc.py")
              if path.startswith("src/archive_scan_qc/") and "scan_processing" in path:
                  tests.update(
                      {
                          "tests/test_scan_processing_combo.py",
                          "tests/test_scan_processing_reuse.py",
                          "tests/test_scan_processing_algorithm_regression.py",
                      }
                  )
              if any(
                  token in path
                  for token in (
                      "background_stains",
                      "edge_shadow",
                      "tone_normalization",
                      "scanline",
                  )
              ):
                  tests.update(
                      {
                          "tests/test_scan_background_stains.py",
                          "tests/test_scan_edge_shadow.py",
                          "tests/test_scan_tone_normalization.py",
                          "tests/test_scanline_lightening.py",
                      }
                  )

          for test in sorted(tests):
              if test.endswith(".py") and not Path(test).exists():
                  continue
              print(test)
          PY
          if [ -s /tmp/targeted-tests.txt ]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            tests="$(tr '\n' ' ' < /tmp/targeted-tests.txt | sed 's/[[:space:]]*$//')"
            echo "tests=${tests}" >> "$GITHUB_OUTPUT"
          else
            echo "run_tests=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Changed files:"
          cat /tmp/changed-files.txt
          echo "Selected tests:"
          cat /tmp/targeted-tests.txt

      - name: Run targeted tests
        if: steps.targeted.outputs.run_tests == 'true'
        run: |
          PYTHONPATH=src python -m unittest ${{ steps.targeted.outputs.tests }}

      - name: Skip targeted tests
        if: steps.targeted.outputs.run_tests != 'true'
        run: echo "No Python source or test changes require targeted unittest coverage."

  main-compat-smoke:
    name: Main compatibility smoke Python ${{ matrix.python-version }}
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'standard')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        shell: bash
        run: |
          set -euo pipefail
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune --depth=1 origin "+${GITHUB_REF}:refs/remotes/ci/ref"
          git checkout --force refs/remotes/ci/ref

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package for smoke tests
        run: python -m pip install -e .

      - name: Validate frontend workbench
        run: PYTHONPATH=src python scripts/validate_frontend_workbench.py

      - name: Compile source and tests
        run: PYTHONPATH=src python -m compileall -q src tests

      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .

      - name: Install wheel and smoke test console script
        run: |
          python -m venv /tmp/archive-scan-qc-smoke
          /tmp/archive-scan-qc-smoke/bin/python -m pip install --upgrade pip
          /tmp/archive-scan-qc-smoke/bin/python -m pip install dist/ai4archive-*.whl
          /tmp/archive-scan-qc-smoke/bin/archive-scan-qc --version

  main-full-tests:
    name: Main full tests Python 3.11 shard ${{ matrix.shard-label }}/4
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'standard')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard-index: 0
            shard-label: 1
          - shard-index: 1
            shard-label: 2
          - shard-index: 2
            shard-label: 3
          - shard-index: 3
            shard-label: 4

    steps:
      - name: Check out repository
        shell: bash
        run: |
          set -euo pipefail
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune --depth=1 origin "+${GITHUB_REF}:refs/remotes/ci/ref"
          git checkout --force refs/remotes/ci/ref

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package for tests
        run: python -m pip install -e .

      - name: Select full-test shard
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python - <<'PY' > /tmp/test-shard.txt
          import hashlib
          import unittest

          shard_index = ${{ matrix.shard-index }}
          shard_count = 4

          def iter_cases(suite):
              for item in suite:
                  if isinstance(item, unittest.TestSuite):
                      yield from iter_cases(item)
                  else:
                      yield item

          suite = unittest.defaultTestLoader.discover("tests")
          test_ids = sorted(test.id() for test in iter_cases(suite))
          for test_id in test_ids:
              digest = hashlib.sha256(test_id.encode("utf-8")).hexdigest()
              if int(digest[:8], 16) % shard_count == shard_index:
                  print(test_id)
          PY
          test_count="$(wc -l < /tmp/test-shard.txt | tr -d ' ')"
          if [ "$test_count" -eq 0 ]; then
            echo "No tests selected for shard ${{ matrix.shard-label }}/4"
            exit 1
          fi
          echo "Selected ${test_count} tests for shard ${{ matrix.shard-label }}/4"

      - name: Run full-test shard
        run: PYTHONPATH=src:tests python -m unittest $(cat /tmp/test-shard.txt)

  deep-full-test-build-smoke:
    name: Deep full Python ${{ matrix.python-version }}
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'deep-full')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        shell: bash
        run: |
          set -euo pipefail
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune --depth=1 origin "+${GITHUB_REF}:refs/remotes/ci/ref"
          git checkout --force refs/remotes/ci/ref

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package for tests
        run: python -m pip install -e .

      - name: Validate frontend workbench
        run: PYTHONPATH=src python scripts/validate_frontend_workbench.py

      - name: Run unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests

      - name: Compile source and tests
        run: PYTHONPATH=src python -m compileall -q src tests

      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .

      - name: Install wheel and smoke test console script
        run: |
          python -m venv /tmp/archive-scan-qc-smoke
          /tmp/archive-scan-qc-smoke/bin/python -m pip install --upgrade pip
          /tmp/archive-scan-qc-smoke/bin/python -m pip install dist/ai4archive-*.whl
          /tmp/archive-scan-qc-smoke/bin/archive-scan-qc --version
